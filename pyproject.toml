[project]
name = "mcp-magichour"
version = "0.1.0"
description = "OpenAPI-backed MCP server wrapping the Magic Hour API"
requires-python = ">=3.10"
dependencies = [
    "fastmcp==4.0.3",
    "mcp==2.2.0",
    "httpx2==2.13.0",
    "jsonschema>=4.20.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0",
    "posthog==7.51.2",
    "starlette>=1.0.1",
    "uvicorn>=0.35.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_magichour*"]

[tool.setuptools.package-data]
mcp_magichour = ["favicon.ico", "static/project-result/index.html", "static/project-result/assets/*"]

[tool.vercel.scripts]
build = "npm --prefix web ci && npm --prefix web run build"
